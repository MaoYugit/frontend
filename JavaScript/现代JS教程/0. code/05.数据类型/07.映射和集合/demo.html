      let arr = [1, 1, 2, 3, 2, 3, 4, 5, 4, 5];
      function unique(arr) {
        return [...new Set(arr)];
      }
      console.log(unique(arr));

      function a_clean(arr) {
        let map = new Map();

        for (let word of arr) {
          let sorted = word.toLowerCase().split("").sort().join("");
          map.set(sorted, word);
        }
        return [...map.values()];
      }
